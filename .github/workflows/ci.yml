name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: apps/extension/dist
          if-no-files-found: error

  e2e:
    name: Extension e2e (Playwright, headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx --workspace apps/extension playwright install --with-deps chromium
      - run: npm run build --workspace apps/extension
      - run: npm run test:e2e --workspace apps/extension
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/extension/playwright-report
          if-no-files-found: ignore
